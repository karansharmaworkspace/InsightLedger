<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="cyan5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#00d4ff"/></marker>
  </defs>
  <style>
    @keyframes fadeInUp { from { opacity:0; } to { opacity:1; } }
    @keyframes drawLine { from { stroke-dashoffset:40; } to { stroke-dashoffset:0; } }
    @keyframes scanMove { 0%,100% { opacity:0.15; } 50% { opacity:0.4; } }
    @keyframes pulse { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:0.4; } }
    @keyframes tileScan { 0%,100% { opacity:0.15; } 50% { opacity:0.45; } }
    .f1 { animation: fadeInUp 0.5s ease-out 0.1s both; }
    .f2 { animation: fadeInUp 0.5s ease-out 0.25s both; }
    .f3 { animation: fadeInUp 0.5s ease-out 0.4s both; }
    .f4 { animation: fadeInUp 0.5s ease-out 0.55s both; }
    .flow { animation: drawLine 0.8s ease-out forwards; stroke-dasharray:40; }
    .scan { animation: scanMove 2s ease-in-out infinite; }
    .tile { animation: tileScan 1.5s ease-in-out infinite; }
    .tile-d { animation: tileScan 1.5s ease-in-out 0.2s infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>
  <rect width="850" height="420" fill="url(#bg5)" rx="12"/>
  <text x="425" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" class="f1">OCR ENGINE</text>
  <line x1="370" y1="50" x2="480" y2="50" stroke="url(#cyan5)" stroke-width="2"/>
  <text x="425" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7a8ba8" text-anchor="middle" class="f2">CRAFT Detection + TrOCR Recognition + Adaptive Screening</text>

  <!-- CRAFT Section -->
  <g transform="translate(30, 90)" class="f2">
    <rect width="380" height="140" rx="8" fill="#111633" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="190" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#00d4ff" text-anchor="middle" font-weight="700">CRAFT TEXT DETECTOR</text>

    <rect x="20" y="45" width="80" height="60" rx="4" fill="#0d1230" stroke="#1e2a4a"/>
    <text x="60" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7a8ba8" text-anchor="middle">P&amp;ID</text>
    <text x="60" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7a8ba8" text-anchor="middle">Image</text>
    <line x1="100" y1="75" x2="130" y2="75" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#a5)" class="flow"/>

    <rect x="130" y="45" width="80" height="60" rx="4" fill="#0d1230" stroke="#00d4ff" stroke-width="1"/>
    <rect x="140" y="52" width="25" height="18" rx="2" fill="#00d4ff" stroke="#00d4ff" stroke-width="0.5" class="tile"/>
    <rect x="168" y="52" width="25" height="18" rx="2" fill="#00d4ff" stroke="#00d4ff" stroke-width="0.5" class="tile-d"/>
    <rect x="140" y="73" width="25" height="18" rx="2" fill="#00d4ff" stroke="#00d4ff" stroke-width="0.5" class="tile-d"/>
    <rect x="168" y="73" width="25" height="18" rx="2" fill="#00d4ff" stroke="#00d4ff" stroke-width="0.5" class="tile"/>
    <text x="170" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#7a8ba8" text-anchor="middle">SAHI Tiling</text>
    <line x1="210" y1="75" x2="240" y2="75" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#a5)" class="flow" style="animation-delay:0.3s"/>

    <rect x="240" y="45" width="120" height="60" rx="4" fill="#0d1230" stroke="#00d4ff" stroke-width="1" class="pulse"/>
    <text x="300" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">Text Regions</text>
    <text x="300" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#00e5c0" text-anchor="middle">BBox + confidence</text>

    <text x="190" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7a8ba8" text-anchor="middle">canvas=2560 | tile=1280 | overlap=0.2 | NMS IoU=0.3</text>
  </g>

  <line x1="425" y1="235" x2="425" y2="255" stroke="#00d4ff" stroke-width="2" marker-end="url(#a5)" class="flow" style="animation-delay:0.5s"/>

  <!-- TrOCR Section -->
  <g transform="translate(30, 260)" class="f3">
    <rect width="790" height="140" rx="8" fill="#111633" stroke="#a855f7" stroke-width="1.5"/>
    <text x="395" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a855f7" text-anchor="middle" font-weight="700">TrOCR RECOGNIZER + ADAPTIVE SCREENING</text>

    <rect x="20" y="45" width="90" height="60" rx="4" fill="#0d1230" stroke="#1e2a4a"/>
    <text x="65" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Cropped</text>
    <text x="65" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Region</text>
    <line x1="110" y1="75" x2="140" y2="75" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a5)" class="flow" style="animation-delay:0.6s"/>

    <rect x="140" y="40" width="200" height="70" rx="4" fill="#0d1230" stroke="#a855f7" stroke-width="1"/>
    <text x="240" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a855f7" text-anchor="middle" font-weight="600">Adaptive Variants</text>
    <rect x="150" y="65" width="45" height="22" rx="3" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="0.5" class="tile"/>
    <text x="172" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">Orig</text>
    <rect x="202" y="65" width="45" height="22" rx="3" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="0.5" class="tile-d"/>
    <text x="224" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">2x Scale</text>
    <rect x="254" y="65" width="45" height="22" rx="3" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="0.5" class="tile"/>
    <text x="276" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">3x Scale</text>
    <rect x="306" y="65" width="28" height="22" rx="3" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="0.5" class="tile-d"/>
    <text x="320" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">CLAHE</text>
    <line x1="340" y1="75" x2="370" y2="75" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a5)" class="flow" style="animation-delay:0.8s"/>

    <rect x="370" y="45" width="160" height="60" rx="4" fill="#0d1230" stroke="#a855f7" stroke-width="1" class="pulse"/>
    <text x="450" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">TrOCR-small-printed</text>
    <text x="450" y="83" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffd700" text-anchor="middle">microsoft/trocr</text>
    <line x1="530" y1="75" x2="560" y2="75" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a5)" class="flow" style="animation-delay:1s"/>

    <rect x="560" y="45" width="110" height="60" rx="4" fill="#0d1230" stroke="#00e5c0" stroke-width="1"/>
    <text x="615" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">Text + Conf</text>
    <text x="615" y="83" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#00e5c0" text-anchor="middle">Tag filtering</text>

    <rect x="690" y="45" width="90" height="60" rx="4" fill="#0d1230" stroke="#ff6b35" stroke-width="1"/>
    <text x="735" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">Tag Filter</text>
    <text x="735" y="83" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ff6b35" text-anchor="middle">Regex match</text>

    <text x="395" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7a8ba8" text-anchor="middle">conf_thresh=0.3 | max_tokens=64 | softmax confidence | early-stop on high conf</text>
  </g>
</svg>