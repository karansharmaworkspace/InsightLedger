<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="cyan6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fadeInUp { from { opacity:0; } to { opacity:1; } }
    @keyframes nodeGlow { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:0.5; } }
    @keyframes drawDash { from { stroke-dashoffset:20; } to { stroke-dashoffset:0; } }
    @keyframes scanBox { 0%,100% { opacity:0.6; } 50% { opacity:0.2; } }
    .f1 { animation: fadeInUp 0.5s ease-out 0.1s both; }
    .f2 { animation: fadeInUp 0.5s ease-out 0.25s both; }
    .f3 { animation: fadeInUp 0.5s ease-out 0.4s both; }
    .f4 { animation: fadeInUp 0.5s ease-out 0.55s both; }
    .ng { animation: nodeGlow 2s ease-in-out infinite; }
    .dash { animation: drawDash 1s ease-out forwards; stroke-dasharray:20; }
    .scan { animation: scanBox 1.5s ease-in-out infinite; }
    .scan-d { animation: scanBox 1.5s ease-in-out 0.3s infinite; }
    .scan-d2 { animation: scanBox 1.5s ease-in-out 0.6s infinite; }
    .scan-d3 { animation: scanBox 1.5s ease-in-out 0.9s infinite; }
  </style>
  <rect width="800" height="450" fill="url(#bg6)" rx="12"/>
  <text x="400" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" class="f1">KNOWLEDGE GRAPH EXTRACTION</text>
  <line x1="300" y1="50" x2="500" y2="50" stroke="url(#cyan6)" stroke-width="2"/>

  <!-- Left: P&amp;ID input -->
  <g transform="translate(30, 75)" class="f2">
    <rect width="240" height="330" rx="8" fill="#111633" stroke="#1e2a4a"/>
    <text x="120" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7a8ba8" text-anchor="middle" letter-spacing="2">P&amp;ID INPUT</text>

    <line x1="30" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="160" x2="210" y2="160" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="240" x2="210" y2="240" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="50" x2="120" y2="280" stroke="#334155" stroke-width="2"/>

    <polygon points="80,72 90,80 80,88" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <polygon points="90,72 80,80 90,88" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <circle cx="160" cy="80" r="15" fill="none" stroke="#00e5c0" stroke-width="1.5"/>
    <circle cx="120" cy="160" r="12" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <text x="120" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">TI</text>
    <rect x="100" y="228" width="40" height="24" rx="3" fill="none" stroke="#ff6b35" stroke-width="1.5"/>

    <rect x="65" y="63" width="40" height="28" rx="2" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="3,2" class="scan"/>
    <rect x="140" y="60" width="40" height="40" rx="2" fill="none" stroke="#00e5c0" stroke-width="1" stroke-dasharray="3,2" class="scan-d"/>
    <rect x="105" y="145" width="30" height="30" rx="2" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2" class="scan-d2"/>
    <rect x="95" y="223" width="50" height="34" rx="2" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,2" class="scan-d3"/>

    <text x="120" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">32-class YOLO detection</text>
    <text x="120" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">605-subclass DINOv2 reclass</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(280, 200)" class="f3">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#cyan6)" stroke-width="2" class="dash"/>
    <polygon points="50,-6 62,0 50,6" fill="#00d4ff"/>
  </g>

  <!-- Right: Knowledge Graph -->
  <g transform="translate(350, 75)" class="f4">
    <rect width="420" height="330" rx="8" fill="#111633" stroke="#a855f7" stroke-width="1.5"/>
    <text x="210" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle" letter-spacing="2">KNOWLEDGE GRAPH</text>

    <circle cx="210" cy="100" r="28" fill="#0d1230" stroke="#00d4ff" stroke-width="2" class="ng"/>
    <text x="210" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="600">P&amp;ID</text>
    <text x="210" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#00d4ff" text-anchor="middle">Document</text>

    <circle cx="90" cy="180" r="22" fill="#0d1230" stroke="#00d4ff" stroke-width="1.5" class="ng" style="animation-delay:0.3s"/>
    <text x="90" y="177" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Gate</text>
    <text x="90" y="189" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#00d4ff" text-anchor="middle">Valve</text>
    <line x1="192" y1="122" x2="108" y2="162" stroke="#334155" stroke-width="1.5" class="dash"/>

    <circle cx="330" cy="180" r="22" fill="#0d1230" stroke="#00e5c0" stroke-width="1.5" class="ng" style="animation-delay:0.6s"/>
    <text x="330" y="177" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Centrif.</text>
    <text x="330" y="189" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#00e5c0" text-anchor="middle">Pump</text>
    <line x1="228" y1="122" x2="312" y2="162" stroke="#334155" stroke-width="1.5" class="dash" style="animation-delay:0.2s"/>

    <circle cx="90" cy="270" r="22" fill="#0d1230" stroke="#a855f7" stroke-width="1.5" class="ng" style="animation-delay:0.9s"/>
    <text x="90" y="267" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Temp.</text>
    <text x="90" y="279" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">Indicator</text>
    <line x1="78" y1="198" x2="78" y2="252" stroke="#334155" stroke-width="1.5" class="dash" style="animation-delay:0.4s"/>

    <circle cx="330" cy="270" r="22" fill="#0d1230" stroke="#ff6b35" stroke-width="1.5" class="ng" style="animation-delay:1.2s"/>
    <text x="330" y="267" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Shell &amp;</text>
    <text x="330" y="279" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#ff6b35" text-anchor="middle">Tube HX</text>
    <line x1="342" y1="198" x2="342" y2="252" stroke="#334155" stroke-width="1.5" class="dash" style="animation-delay:0.6s"/>

    <line x1="112" y1="180" x2="308" y2="180" stroke="#ffd700" stroke-width="1" stroke-dasharray="4,3" class="dash" style="animation-delay:0.8s"/>
    <line x1="112" y1="270" x2="308" y2="270" stroke="#ffd700" stroke-width="1" stroke-dasharray="4,3" class="dash" style="animation-delay:1s"/>
    <line x1="210" y1="128" x2="210" y2="150" stroke="#334155" stroke-width="1.5"/>
    <line x1="210" y1="150" x2="90" y2="158" stroke="#334155" stroke-width="1"/>
    <line x1="210" y1="150" x2="330" y2="158" stroke="#334155" stroke-width="1"/>

    <text x="200" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="7" fill="#ffd700">CONNECTED_TO</text>
    <text x="62" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="7" fill="#ffd700">MEASURES</text>
    <text x="320" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="7" fill="#ffd700">HEATS</text>

    <text x="210" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Nodes: symbols | Edges: pipe connections</text>
    <text x="210" y="336" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Export: GraphML + DEXPI JSON + CSV</text>
  </g>
</svg>