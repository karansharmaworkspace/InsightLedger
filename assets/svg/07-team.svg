<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="cyan7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <linearGradient id="purple7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fadeInUp { from { opacity:0; } to { opacity:1; } }
    @keyframes cardSlide { from { opacity:0; } to { opacity:1; } }
    @keyframes glow { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:0.5; } }
    .f1 { animation: fadeInUp 0.5s ease-out 0.1s both; }
    .f2 { animation: fadeInUp 0.5s ease-out 0.2s both; }
    .f3 { animation: fadeInUp 0.5s ease-out 0.3s both; }
    .c1 { animation: cardSlide 0.6s ease-out 0.3s both; }
    .c2 { animation: cardSlide 0.6s ease-out 0.45s both; }
    .c3 { animation: cardSlide 0.6s ease-out 0.6s both; }
    .c4 { animation: cardSlide 0.6s ease-out 0.75s both; }
    .g { animation: glow 2.5s ease-in-out infinite; }
    .g-d { animation: glow 2.5s ease-in-out 0.6s infinite; }
    .g-d2 { animation: glow 2.5s ease-in-out 1.2s infinite; }
    .g-d3 { animation: glow 2.5s ease-in-out 1.8s infinite; }
  </style>
  <rect width="900" height="400" fill="url(#bg7)" rx="12"/>
  <text x="450" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle" class="f1">TEAM INSIGHTLEDGER</text>
  <line x1="370" y1="55" x2="530" y2="55" stroke="url(#cyan7)" stroke-width="2"/>
  <text x="450" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7a8ba8" text-anchor="middle" class="f2">The minds behind DocuPID</text>

  <!-- Member 1 -->
  <g transform="translate(50, 100)" class="c1">
    <rect width="180" height="220" rx="10" fill="#111633" stroke="#1e2a4a"/>
    <circle cx="90" cy="60" r="35" fill="url(#purple7)" class="g"/>
    <text x="90" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">T</text>
    <text x="90" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Tapesh Kumar</text>
    <text x="90" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle">Team Leader</text>
    <line x1="30" y1="150" x2="150" y2="150" stroke="#1e2a4a"/>
    <text x="90" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Architecture</text>
    <text x="90" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Pipeline Design</text>
    <text x="90" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Coordination</text>
  </g>

  <!-- Member 2 -->
  <g transform="translate(260, 100)" class="c2">
    <rect width="180" height="220" rx="10" fill="#111633" stroke="#1e2a4a"/>
    <circle cx="90" cy="60" r="35" fill="url(#cyan7)" class="g-d"/>
    <text x="90" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#0a0e27" text-anchor="middle" font-weight="700">K</text>
    <text x="90" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Karan Sharma</text>
    <text x="90" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00e5c0" text-anchor="middle">Developer</text>
    <line x1="30" y1="150" x2="150" y2="150" stroke="#1e2a4a"/>
    <text x="90" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Detection Systems</text>
    <text x="90" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Topology Engine</text>
    <text x="90" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">GUI Development</text>
  </g>

  <!-- Member 3 -->
  <g transform="translate(470, 100)" class="c3">
    <rect width="180" height="220" rx="10" fill="#111633" stroke="#1e2a4a"/>
    <circle cx="90" cy="60" r="35" fill="#ff6b35" class="g-d2"/>
    <text x="90" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">H</text>
    <text x="90" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Harshit Goyal</text>
    <text x="90" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ff6b35" text-anchor="middle">Developer</text>
    <line x1="30" y1="150" x2="150" y2="150" stroke="#1e2a4a"/>
    <text x="90" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Classification Models</text>
    <text x="90" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">DINOv2 Integration</text>
    <text x="90" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">RAG Pipeline</text>
  </g>

  <!-- Member 4 -->
  <g transform="translate(680, 100)" class="c4">
    <rect width="180" height="220" rx="10" fill="#111633" stroke="#1e2a4a"/>
    <circle cx="90" cy="60" r="35" fill="#ffd700" class="g-d3"/>
    <text x="90" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#0a0e27" text-anchor="middle" font-weight="700">D</text>
    <text x="90" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Divya Swami</text>
    <text x="90" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="middle">Developer</text>
    <line x1="30" y1="150" x2="150" y2="150" stroke="#1e2a4a"/>
    <text x="90" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">API Development</text>
    <text x="90" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Backend Systems</text>
    <text x="90" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Deployment</text>
  </g>

  <text x="450" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7a8ba8" text-anchor="middle">ET Hackathon 2.0 | Industrial P&amp;ID Digitization</text>
</svg>