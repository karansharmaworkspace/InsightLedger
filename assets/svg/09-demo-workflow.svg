<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="cyan9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <marker id="arrow9" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#00d4ff"/></marker>
  </defs>
  <rect width="900" height="450" fill="url(#bg9)" rx="12"/>
  <text x="450" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">USER WORKFLOW</text>
  <line x1="370" y1="55" x2="530" y2="55" stroke="url(#cyan9)" stroke-width="2"/>
  <text x="450" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7a8ba8" text-anchor="middle">From paper P&amp;ID to digital knowledge in minutes</text>

  <!-- Step 1: Upload -->
  <g transform="translate(30, 100)">
    <rect width="150" height="120" rx="8" fill="#111633" stroke="#00d4ff" stroke-width="1.5"/>
    <circle cx="75" cy="40" r="25" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <line x1="75" y1="22" x2="75" y2="58" stroke="#00d4ff" stroke-width="2"/>
    <line x1="57" y1="40" x2="93" y2="40" stroke="#00d4ff" stroke-width="2"/>
    <text x="75" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Upload</text>
    <text x="75" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Drag &amp; drop P&amp;ID</text>
    <text x="75" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">PDF / PNG / DWG</text>
  </g>
  <line x1="180" y1="160" x2="210" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow9)"/>

  <!-- Step 2: Process -->
  <g transform="translate(210, 100)">
    <rect width="150" height="120" rx="8" fill="#111633" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="30" y="25" width="90" height="40" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="40" y="32" width="20" height="12" rx="2" fill="#a855f7" opacity="0.3" stroke="#a855f7" stroke-width="0.5"/>
    <rect x="65" y="38" width="35" height="12" rx="2" fill="#00e5c0" opacity="0.3" stroke="#00e5c0" stroke-width="0.5"/>
    <text x="75" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">AI Process</text>
    <text x="75" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">OCR + Detection</text>
    <text x="75" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Classification</text>
  </g>
  <line x1="360" y1="160" x2="390" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow9)"/>

  <!-- Step 3: Review -->
  <g transform="translate(390, 100)">
    <rect width="150" height="120" rx="8" fill="#111633" stroke="#ff6b35" stroke-width="1.5"/>
    <rect x="25" y="25" width="100" height="40" rx="4" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <circle cx="50" cy="45" r="10" fill="none" stroke="#00e5c0" stroke-width="1.5"/>
    <circle cx="100" cy="45" r="10" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <line x1="60" y1="45" x2="90" y2="45" stroke="#ffd700" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="75" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Review</text>
    <text x="75" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Visual overlay</text>
    <text x="75" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Confidence scores</text>
  </g>
  <line x1="540" y1="160" x2="570" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow9)"/>

  <!-- Step 4: Export -->
  <g transform="translate(570, 100)">
    <rect width="150" height="120" rx="8" fill="#111633" stroke="#ffd700" stroke-width="1.5"/>
    <rect x="25" y="25" width="100" height="40" rx="4" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <text x="75" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#ffd700" text-anchor="middle">DEXPI</text>
    <text x="75" y="54" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#ffd700" text-anchor="middle">GraphML CSV</text>
    <text x="75" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Export</text>
    <text x="75" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Multiple formats</text>
    <text x="75" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Standards compliant</text>
  </g>
  <line x1="720" y1="160" x2="750" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow9)"/>

  <!-- Step 5: Knowledge -->
  <g transform="translate(750, 100)">
    <rect width="120" height="120" rx="8" fill="#111633" stroke="#00e5c0" stroke-width="1.5"/>
    <circle cx="60" cy="45" r="20" fill="none" stroke="#00e5c0" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="6" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="75" cy="35" r="6" fill="none" stroke="#a855f7" stroke-width="1"/>
    <circle cx="60" cy="55" r="6" fill="none" stroke="#ff6b35" stroke-width="1"/>
    <line x1="51" y1="37" x2="69" y2="37" stroke="#ffd700" stroke-width="0.5"/>
    <line x1="49" y1="42" x2="56" y2="50" stroke="#ffd700" stroke-width="0.5"/>
    <line x1="71" y1="42" x2="64" y2="50" stroke="#ffd700" stroke-width="0.5"/>
    <text x="60" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Query</text>
    <text x="60" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">RAG search</text>
    <text x="60" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7a8ba8" text-anchor="middle">Knowledge graph</text>
  </g>

  <!-- Bottom: Time comparison -->
  <g transform="translate(30, 260)">
    <rect width="840" height="100" rx="8" fill="#111633" stroke="#1e2a4a"/>
    <text x="420" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7a8ba8" text-anchor="middle" letter-spacing="2">TIME COMPARISON</text>
    
    <!-- Manual -->
    <g transform="translate(40, 40)">
      <text x="0" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ff6b35">Manual Digitization</text>
      <rect x="0" y="20" width="600" height="16" rx="3" fill="#ff6b35" opacity="0.2" stroke="#ff6b35" stroke-width="0.5"/>
      <text x="300" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#ff6b35" text-anchor="middle">6-12 months per plant</text>
    </g>
    
    <!-- DocuPID -->
    <g transform="translate(40, 70)">
      <text x="0" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00e5c0">DocuPID</text>
      <rect x="0" y="20" width="80" height="16" rx="3" fill="#00e5c0" opacity="0.2" stroke="#00e5c0" stroke-width="0.5"/>
      <text x="40" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#00e5c0" text-anchor="middle">15 minutes</text>
    </g>
  </g>

  <text x="450" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7a8ba8" text-anchor="middle">500x faster than manual conversion</text>
</svg>