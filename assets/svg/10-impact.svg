    <g transform="translate(430, 40)">
      <rect width="180" height="60" rx="6" fill="#0d1230" stroke="#1e2a4a"/>
      <text x="90" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">For Operations</text>
      <text x="90" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7a8ba8" text-anchor="middle">Predictive maintenance insights</text>
    </g>
    <g transform="translate(630, 40)">
      <rect width="180" height="60" rx="6" fill="#0d1230" stroke="#1e2a4a"/>
      <text x="90" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">For Management</text>
      <text x="90" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7a8ba8" text-anchor="middle">Knowledge preservation</text>
