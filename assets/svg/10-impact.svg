    <text x="130" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="middle" letter-spacing="2">IMMEDIATE IMPACT</text>
    
    <text x="130" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="url(#cyan10)" text-anchor="middle">500x</text>
    <text x="130" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7a8ba8" text-anchor="middle">faster than manual digitization</text>
    
    <line x1="30" y1="95" x2="230" y2="95" stroke="#1e2a4a"/>
    
