      <text x="50" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Water</text>
    </g>
    <g transform="translate(130, 110)">
      <rect width="100" height="28" rx="4" fill="#0d1230" stroke="#1e2a4a"/>
      <text x="50" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Mining</text>
