<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="cyan10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <linearGradient id="purple10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg10)" rx="12"/>
  <text x="450" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">IMPACT &amp; FUTURE</text>
  <line x1="370" y1="55" x2="530" y2="55" stroke="url(#cyan10)" stroke-width="2"/>

  <!-- Impact Stats -->
  <g transform="translate(30, 80)">
