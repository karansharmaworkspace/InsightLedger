<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
  </defs>
  <rect width="700" height="200" rx="12" fill="url(#bg3)"/>
  <text x="350" y="28" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#5a8ab5" font-weight="600" letter-spacing="3">4-TIER CLASSIFICATION</text>
  <!-- Tier cards -->
  <g transform="translate(50,50)">
    <!-- Tier 1 -->
    <g>
      <rect x="0" y="0" width="130" height="120" rx="10" fill="#0d1a2d" stroke="#00d4ff" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <circle cx="65" cy="40" r="18" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;20;16" dur="4s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" begin="0s"/>
      </circle>
      <text x="65" y="44" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#00d4ff" font-weight="700">T1</text>
      <text x="65" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#5a8ab5" font-weight="600">DEVICE</text>
      <text x="65" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Pump, Valve</text>
      <text x="65" y="100" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Compressor</text>
      <text x="65" y="114" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Exchanger</text>
    </g>
    <!-- Tier 2 -->
    <g transform="translate(155,0)">
      <rect x="0" y="0" width="130" height="120" rx="10" fill="#0d1a2d" stroke="#00ff88" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" begin="1s"/>
      </rect>
      <circle cx="65" cy="40" r="18" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;20;16" dur="4s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="65" y="44" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#00ff88" font-weight="700">T2</text>
      <text x="65" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#5a8ab5" font-weight="600">CONNECTION</text>
      <text x="65" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Pipe Join</text>
      <text x="65" y="100" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Elbow, Tee</text>
      <text x="65" y="114" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Cross, Flange</text>
    </g>
    <!-- Tier 3 -->
    <g transform="translate(310,0)">
      <rect x="0" y="0" width="130" height="120" rx="10" fill="#0d1a2d" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" begin="2s"/>
      </rect>
      <circle cx="65" cy="40" r="18" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;20;16" dur="4s" repeatCount="indefinite" begin="2s"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" begin="2s"/>
      </circle>
      <text x="65" y="44" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#ff6b6b" font-weight="700">T3</text>
      <text x="65" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#5a8ab5" font-weight="600">STRUCTURE</text>
      <text x="65" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Line Segment</text>
      <text x="65" y="100" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Node Box</text>
      <text x="65" y="114" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Boundary</text>
    </g>
    <!-- Tier 4 -->
    <g transform="translate(465,0)">
      <rect x="0" y="0" width="130" height="120" rx="10" fill="#0d1a2d" stroke="#ffd93d" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" begin="3s"/>
      </rect>
      <circle cx="65" cy="40" r="18" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;20;16" dur="4s" repeatCount="indefinite" begin="3s"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" begin="3s"/>
      </circle>
      <text x="65" y="44" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#ffd93d" font-weight="700">T4</text>
      <text x="65" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#5a8ab5" font-weight="600">ANNOTATION</text>
      <text x="65" y="86" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Tag Number</text>
      <text x="65" y="100" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Spec Text</text>
      <text x="65" y="114" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Note, Legend</text>
    </g>
  </g>
</svg>