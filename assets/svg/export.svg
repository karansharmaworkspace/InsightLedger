<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
  </defs>
  <rect width="700" height="160" rx="12" fill="url(#bg5)"/>
  <text x="350" y="28" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#5a8ab5" font-weight="600" letter-spacing="3">EXPORT FORMATS</text>
  <!-- Format cards -->
  <g transform="translate(50,50)">
    <!-- DEXPI -->
    <g>
      <rect x="0" y="0" width="100" height="80" rx="8" fill="#0d1a2d" stroke="#00d4ff" stroke-width="1.5"/>
      <text x="50" y="30" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#00d4ff" font-weight="700">DEXPI</text>
      <text x="50" y="48" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">CAEX/XML</text>
      <text x="50" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Standard</text>
      <rect x="0" y="0" width="100" height="80" rx="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="0s"/>
      </rect>
    </g>
    <!-- GraphML -->
    <g transform="translate(120,0)">
      <rect x="0" y="0" width="100" height="80" rx="8" fill="#0d1a2d" stroke="#00ff88" stroke-width="1.5"/>
      <text x="50" y="30" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#00ff88" font-weight="700">GraphML</text>
      <text x="50" y="48" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">XML Graph</text>
      <text x="50" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Topology</text>
      <rect x="0" y="0" width="100" height="80" rx="8" fill="none" stroke="#00ff88" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </rect>
    </g>
    <!-- JSON -->
    <g transform="translate(240,0)">
      <rect x="0" y="0" width="100" height="80" rx="8" fill="#0d1a2d" stroke="#ff6b6b" stroke-width="1.5"/>
      <text x="50" y="30" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#ff6b6b" font-weight="700">JSON</text>
      <text x="50" y="48" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Full Data</text>
      <text x="50" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Complete</text>
      <rect x="0" y="0" width="100" height="80" rx="8" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="1s"/>
      </rect>
    </g>
    <!-- CSV -->
    <g transform="translate(360,0)">
      <rect x="0" y="0" width="100" height="80" rx="8" fill="#0d1a2d" stroke="#ffd93d" stroke-width="1.5"/>
      <text x="50" y="30" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#ffd93d" font-weight="700">CSV</text>
      <text x="50" y="48" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Spreadsheet</text>
      <text x="50" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Compatible</text>
      <rect x="0" y="0" width="100" height="80" rx="8" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </rect>
    </g>
    <!-- PNG -->
    <g transform="translate(480,0)">
      <rect x="0" y="0" width="100" height="80" rx="8" fill="#0d1a2d" stroke="#c084fc" stroke-width="1.5"/>
      <text x="50" y="30" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#c084fc" font-weight="700">PNG</text>
      <text x="50" y="48" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Annotated</text>
      <text x="50" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Visual</text>
      <rect x="0" y="0" width="100" height="80" rx="8" fill="none" stroke="#c084fc" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="2s"/>
      </rect>
    </g>
  </g>
</svg>