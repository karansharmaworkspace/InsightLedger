<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
  </defs>
  <rect width="700" height="160" rx="12" fill="url(#bg6)"/>
  <text x="350" y="28" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#5a8ab5" font-weight="600" letter-spacing="3">AI MODELS</text>
  <!-- Model cards -->
  <g transform="translate(50,50)">
    <!-- YOLOv8 -->
    <g>
      <rect x="0" y="0" width="140" height="80" rx="10" fill="#0d1a2d" stroke="#1a3a5c" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="12" fill="none" stroke="#00d4ff" stroke-width="2"/>
      <text x="25" y="29" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#00d4ff" font-weight="700">Y</text>
      <text x="75" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#5a8ab5" font-weight="600">YOLOv8</text>
      <text x="75" y="42" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Symbol Detection</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">640px tiles</text>
      <text x="75" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#00d4ff">mAP50: 0.92</text>
    </g>
    <!-- DINOv2 -->
    <g transform="translate(160,0)">
      <rect x="0" y="0" width="140" height="80" rx="10" fill="#0d1a2d" stroke="#1a3a5c" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="12" fill="none" stroke="#00ff88" stroke-width="2"/>
      <text x="25" y="29" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#00ff88" font-weight="700">D</text>
      <text x="75" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#5a8ab5" font-weight="600">DINOv2</text>
      <text x="75" y="42" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Reclassification</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">ViT backbone</text>
      <text x="75" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#00ff88">Acc: 95.3%</text>
    </g>
    <!-- TrOCR -->
    <g transform="translate(320,0)">
      <rect x="0" y="0" width="140" height="80" rx="10" fill="#0d1a2d" stroke="#1a3a5c" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="12" fill="none" stroke="#ff6b6b" stroke-width="2"/>
      <text x="25" y="29" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#ff6b6b" font-weight="700">T</text>
      <text x="75" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#5a8ab5" font-weight="600">TrOCR</text>
      <text x="75" y="42" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Text Recognition</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Encoder-Decoder</text>
      <text x="75" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#ff6b6b">NER: 87%</text>
    </g>
    <!-- DBNet -->
    <g transform="translate(480,0)">
      <rect x="0" y="0" width="140" height="80" rx="10" fill="#0d1a2d" stroke="#1a3a5c" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="12" fill="none" stroke="#ffd93d" stroke-width="2"/>
      <text x="25" y="29" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#ffd93d" font-weight="700">DB</text>
      <text x="75" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#5a8ab5" font-weight="600">DBNet</text>
      <text x="75" y="42" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Text Detection</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#3a6a95">Differentiable</text>
      <text x="75" y="72" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" fill="#ffd93d">F: 0.88</text>
    </g>
  </g>
</svg>