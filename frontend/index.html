<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Knowledge Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #1a1a2e; color: white; padding: 1rem; display: flex; align-items: center; gap: 1rem; }
        .header h1 { font-size: 1.2rem; flex: 1; }
        .header .status { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }

        .nav { background: #16213e; display: flex; overflow-x: auto; }
        .nav button { background: none; border: none; color: #94a3b8; padding: 0.75rem 1rem; white-space: nowrap; cursor: pointer; }
        .nav button.active { color: white; border-bottom: 2px solid #3b82f6; }

        .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

        .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1rem; font-size: 0.9rem; line-height: 1.4; }
        .message.user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 0.25rem; }
        .message.assistant { align-self: flex-start; background: white; border: 1px solid #e5e7eb; border-bottom-left-radius: 0.25rem; }
        .message .sources { font-size: 0.75rem; color: #6b7280; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #e5e7eb; }

        .input-area { padding: 1rem; background: white; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }
        .input-area input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 1.5rem; font-size: 1rem; outline: none; }
        .input-area input:focus { border-color: #3b82f6; }
        .input-area button { background: #3b82f6; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .voice-btn { background: #10b981 !important; }
        .voice-btn.recording { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .loading { display: none; padding: 0.5rem 1rem; color: #6b7280; font-size: 0.85rem; }
        .loading.active { display: block; }

        @media (min-width: 768px) {
            .chat-container { max-width: 800px; margin: 0 auto; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="status"></div>
        <h1>Industrial Knowledge Assistant</h1>
    </div>

    <div class="nav">
        <button class="active" onclick="switchTab('chat')">Chat</button>
        <button onclick="switchTab('search')">Search</button>
        <button onclick="switchTab('equipment')">Equipment</button>
        <button onclick="switchTab('maintenance')">Maintenance</button>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message assistant">
                Hello! I'm your Industrial Knowledge Assistant. Ask me anything about equipment, maintenance, procedures, or regulations.
            </div>
        </div>

        <div class="loading" id="loading">Thinking...</div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="voice-btn" onclick="toggleVoice()" title="Voice Input">🎤</button>
            <button onclick="sendMessage()">→</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let isRecording = false;
        let recognition = null;

        function switchTab(tab) {
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            addMessage(query, 'user');
            input.value = '';
            showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/api/query?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                addMessage(data.answer, 'assistant', data.sources);
            } catch (error) {
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
            } finally {
                showLoading(false);
            }
        }

        function addMessage(text, role, sources = []) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            let html = text;
            if (sources.length > 0) {
                html += `<div class="sources">Sources: ${sources.join(', ')}</div>`;
            }
            div.innerHTML = html;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('active', show);
        }

        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                alert('Voice recognition not supported in this browser');
                return;
            }

            const btn = document.querySelector('.voice-btn');

            if (isRecording) {
                recognition.stop();
                btn.classList.remove('recording');
                isRecording = false;
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                sendMessage();
            };

            recognition.onend = () => {
                btn.classList.remove('recording');
                isRecording = false;
            };

            recognition.start();
            btn.classList.add('recording');
            isRecording = true;
        }
    </script>
</body>
</html>
