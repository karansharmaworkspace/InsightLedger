<!DOCTYPE html>
<html>
<head>
    <title>Knowledge Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a2e; }
        svg { width: 100%; height: 700px; }
        .node { cursor: pointer; }
        .node circle { stroke: #fff; stroke-width: 1.5px; }
        .node text { fill: white; font-size: 10px; pointer-events: none; }
        .link { stroke: #666; stroke-opacity: 0.6; }
        .link-label { fill: #888; font-size: 8px; }
    </style>
</head>
<body>
<svg id="graph"></svg>
<script>
const data = {"nodes": [{"id": "equipment_tag:V-101", "label": "V-101", "color": "#3498db", "type": "equipment_tag"}, {"id": "equipment_tag:P-202A", "label": "P-202A", "color": "#3498db", "type": "equipment_tag"}, {"id": "personnel:John Smith", "label": "John Smith", "color": "#2ecc71", "type": "personnel"}, {"id": "regulatory_ref:API 570", "label": "API 570", "color": "#e74c3c", "type": "regulatory_ref"}], "edges": [{"source": "V-101", "target": "P-202A", "relation": "connected_to"}, {"source": "V-101", "target": "John Smith", "relation": "maintained_by"}, {"source": "V-101", "target": "API 570", "relation": "regulated_by"}]};

const svg = d3.select("#graph");
const width = svg.node().getBoundingClientRect().width;
const height = 700;

const simulation = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.edges).id(d => d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(width / 2, height / 2));

const link = svg.append("g")
    .selectAll("line")
    .data(data.edges)
    .join("line")
    .attr("class", "link");

const linkLabel = svg.append("g")
    .selectAll("text")
    .data(data.edges)
    .join("text")
    .attr("class", "link-label")
    .text(d => d.relation);

const node = svg.append("g")
    .selectAll("g")
    .data(data.nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended));

node.append("circle")
    .attr("r", 12)
    .attr("fill", d => d.color);

node.append("text")
    .attr("dx", 15)
    .attr("dy", 4)
    .text(d => d.label);

simulation.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
        .attr("y", d => (d.source.y + d.target.y) / 2);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function dragstarted(event) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    event.subject.fx = event.subject.x;
    event.subject.fy = event.subject.y;
}

function dragged(event) {
    event.subject.fx = event.x;
    event.subject.fy = event.y;
}

function dragended(event) {
    if (!event.active) simulation.alphaTarget(0);
    event.subject.fx = null;
    event.subject.fy = null;
}
</script>
</body>
</html>
